<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Venkata Naga Kusal. Software that keeps your data on your device." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.55" stop-color="#0e1a2c"/>
      <stop offset="1" stop-color="#14345a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee0c3"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- left: identity -->
  <circle cx="86" cy="80" r="5" fill="#3fb950" class="pulse"/>
  <text x="104" y="85" class="mono" font-size="16" fill="#58a6ff">kusal630 / open source</text>

  <text x="80" y="170" class="sans" font-size="60" font-weight="700" fill="#f0f6fc" letter-spacing="-1">Venkata Naga Kusal</text>
  <rect x="82" y="192" width="72" height="4" rx="2" fill="url(#bar)"/>

  <text x="80" y="240" class="sans" font-size="25" fill="#b6c4d6">Software that keeps your data on your device.</text>
  <text x="80" y="290" class="mono" font-size="15" fill="#7d8da1">Android internals  /  Linux networking  /  applied ML</text>

  <!-- right: work at a glance -->
  <g transform="translate(810 62)">
    <rect width="330" height="216" rx="14" fill="#0b1320" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="22" y="36" class="mono" font-size="13" fill="#7d8da1" letter-spacing="1.5">OPEN SOURCE WORK</text>
    <line x1="22" y1="50" x2="308" y2="50" stroke="#ffffff" stroke-opacity="0.1"/>

    <circle cx="26" cy="76" r="5" fill="#3fb950"/>
    <text x="42" y="81" class="sans" font-size="15" fill="#e6edf3">Soul Track</text>
    <text x="308" y="81" class="sans" font-size="13" fill="#8b9bb0" text-anchor="end">completed</text>

    <circle cx="26" cy="106" r="5" fill="#3fb950"/>
    <text x="42" y="111" class="sans" font-size="15" fill="#e6edf3">LocalVault</text>
    <text x="308" y="111" class="sans" font-size="13" fill="#8b9bb0" text-anchor="end">completed</text>

    <circle cx="26" cy="136" r="5" fill="#3fb950"/>
    <text x="42" y="141" class="sans" font-size="15" fill="#e6edf3">Rethink Root, Android</text>
    <text x="308" y="141" class="sans" font-size="13" fill="#8b9bb0" text-anchor="end">completed</text>

    <circle cx="26" cy="166" r="5" fill="#e3b341" class="pulse"/>
    <text x="42" y="171" class="sans" font-size="15" fill="#e6edf3">Rethink Root, Linux</text>
    <text x="308" y="171" class="sans" font-size="13" fill="#8b9bb0" text-anchor="end">in progress</text>

    <circle cx="26" cy="196" r="5" fill="#e3b341" class="pulse"/>
    <text x="42" y="201" class="sans" font-size="15" fill="#e6edf3">PurePad</text>
    <text x="308" y="201" class="sans" font-size="13" fill="#8b9bb0" text-anchor="end">in development</text>
  </g>
</svg>
